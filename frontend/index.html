<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NeuralOps — AI Observability Platform</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('neuralops-theme');
          var mode = 'dark';
          var pref = 'system';
          if (raw === 'light' || raw === 'dark' || raw === 'system') pref = raw;
          else if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.state && parsed.state.preference) pref = parsed.state.preference;
            else if (parsed.state && (parsed.state.theme === 'light' || parsed.state.theme === 'dark')) {
              pref = parsed.state.theme;
            }
          }
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else {
            mode = pref;
          }
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
