server:
  port: 8086
  environment: development

postgres:
  dsn: postgres://neuralops:neuralops@postgres:5432/neuralops?sslmode=disable

redis:
  url: redis://redis:6379/0

incident:
  base_url: http://incident:8084

llm:
  provider: openai
  openai_base_url: https://api.openai.com/v1
  openai_api_key: ""
  openai_model: gpt-4o-mini
  anthropic_api_key: ""
  ollama_base_url: http://ollama:11434
  ollama_model: llama3.1
  max_retries: 3
  initial_backoff: 2s

alerting:
  default_tenant: default
  group_window: 5m
  escalation_check_interval: 1m
  p1_escalate_l2: 5m
  p1_escalate_manager: 15m
  demo_mode: false

oncall:
  schedules_file: configs/oncall_schedules.json
