server:
  port: 8080
  environment: development

services:
  ingestion: http://ingestion:8081
  analysis: http://analysis:8082
  correlation: http://correlation:8083
  incident: http://incident:8084
  search: http://search:8085
  alerting: http://alerting:8086

cors:
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:8080
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-API-Key
    - X-Tenant-ID
    - X-Request-ID
  allow_credentials: true

auth:
  disabled: false
  jwt_issuer: neuralops
  jwt_audience: neuralops-api
  access_token_ttl: 1h
  refresh_token_ttl: 168h
  frontend_url: http://localhost:5173
  allow_dev_login: true
  jwt_public_key_pem: ""
  jwt_private_key_pem: ""
  api_keys:
    demo-api-key:
      tenant_id: "00000000-0000-0000-0000-000000000002"
      user_id: ingest-bot
      role: ADMIN
  oidc:
    enabled: false
    issuer: ""
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/api/v1/auth/oidc/callback
    scopes:
      - openid
      - profile
      - email
    jwks_url: ""
    audience: ""
    default_tenant_id: "00000000-0000-0000-0000-000000000002"

tenant:
  default_tenant: "00000000-0000-0000-0000-000000000002"
  allowed_tenants:
    - "00000000-0000-0000-0000-000000000002"
    - "00000000-0000-0000-0000-000000000001"

rate_limit:
  enabled: true
  requests_per_minute: 600
  burst: 100

auth_rate_limit:
  enabled: true
  requests_per_minute: 20

clickhouse:
  dsn: clickhouse://default:@clickhouse:9000/neuralops

redis:
  url: redis://redis:6379/0

postgres:
  dsn: postgres://neuralops:neuralops@postgres:5432/neuralops?sslmode=disable

llm:
  provider: openai
  openai_base_url: https://api.openai.com/v1
  openai_api_key: ""
  openai_model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  anthropic_api_key: ""
  ollama_base_url: http://ollama:11434
  ollama_model: llama3.1
  max_retries: 3
  initial_backoff: 2s

dashboard:
  fetch_timeout: 3s

websocket:
  ping_interval: 30s

prometheus:
  url: http://prometheus:9090
