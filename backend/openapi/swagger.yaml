# NeuralOps Gateway API v1 — full contract
openapi: 3.0.3
info:
  title: NeuralOps Gateway API
  version: 1.0.0
  description: Complete gateway surface (observability, auth, search, incidents, alerting proxy)
servers:
  - url: http://localhost:8080/api/v1
paths:
  /info:
    get:
      summary: Platform metadata and capability matrix
      responses:
        '200':
          description: Service info with open-standards capabilities
  /unified/incidents/{id}/context:
    get:
      summary: Cross-signal incident triage context (logs, traces, metrics, security)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: services
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Unified context with deep links and correlated findings
  /auth/config:
    get:
      summary: Client auth configuration
  /auth/oidc/start:
    post:
      summary: Begin OIDC PKCE login
  /auth/oidc/callback:
    get:
      summary: OIDC callback
  /auth/dev/login:
    post:
      summary: Dev login
  /dashboard/overview:
    get:
      summary: Command center overview
  /query/unified:
    post:
      summary: Cross-signal unified query (logs/metrics/traces/events)
  /query/validate:
    post:
      summary: Validate unified query syntax/body
  /query/functions:
    get:
      summary: List supported unified query helper functions
  /collectors/fleet:
    get:
      summary: List collector fleet agents
    post:
      summary: Enroll collector fleet agent
  /collectors/fleet/{id}:
    get:
      summary: Get collector fleet agent by id
    put:
      summary: Update collector fleet agent
  /collectors/fleet/{id}/upgrade:
    post:
      summary: Upgrade collector agent version (canary supported via targetVersion)
  /metrics/derived:
    get:
      summary: List derived metric definitions
    post:
      summary: Create derived metric definition
  /metrics/derived/{id}/samples:
    get:
      summary: Materialized derived metric buckets (streaming aggregator)
  /alerts/policies/{id}/scores:
    get:
      summary: Materialized alert fatigue scores per policy
  /alerts/policies/{id}/feedback:
    get:
      summary: List alert quality feedback for a policy
    post:
      summary: Submit alert quality feedback (noise/usefulness)
  /alerts/policies/{id}/trigger:
    post:
      summary: Evaluate and trigger alert policy (routing, suppression, context enrichment)
  /collectors/pipelines:
    get:
      summary: List collector pipelines
    post:
      summary: Create collector pipeline
  /collectors/pipelines/{id}:
    put:
      summary: Update collector pipeline
  /collectors/pipelines/{id}/validate:
    post:
      summary: Validate collector pipeline configuration
  /ai/rca/{incidentId}:
    get:
      summary: Causal root-cause analysis for an incident
  /ai/explanations/{id}:
    get:
      summary: Fetch explainable AI RCA graph by explanation id
  /ai/forecast:
    post:
      summary: Capacity/SLO/incident-risk forecast projection
  /ai/autofix/plan:
    post:
      summary: Generate AutoFix remediation plan with policy evaluation
      description: Returns 403 when AUTOFIX_ENABLED=false (bank default in production).
  /ai/autofix/execute:
    post:
      summary: Execute approved AutoFix plan
      description: Requires approved=true when AUTOFIX_REQUIRE_APPROVAL=true. Role-gated via AUTOFIX_ALLOWED_ROLES.
  /ai/autofix/rollback:
    post:
      summary: Roll back a completed AutoFix action
  /ai/llm/workloads:
    get:
      summary: List LLM inference workloads with latency, token, and cost metrics
  /ai/llm/usage:
    get:
      summary: Aggregate LLM token and cost usage for a time window
      parameters:
        - name: window
          in: query
          schema:
            type: string
            default: 24h
  /finops/costs:
    get:
      summary: FinOps cost trends and budget comparison
  /finops/costs/breakdown:
    get:
      summary: FinOps cost allocation breakdown tree
  /finops/allocation/rules:
    get:
      summary: List FinOps allocation rules
    post:
      summary: Create FinOps allocation rule
  /finops/kubernetes/cost:
    get:
      summary: Kubernetes namespace/workload cost allocation
  /finops/anomalies:
    get:
      summary: FinOps cost anomaly alerts
  /finops/recommendations:
    get:
      summary: FinOps optimization recommendations
  /finops/budgets:
    get:
      summary: List FinOps budgets
    post:
      summary: Create FinOps budget
  /finops/budgets/alerts:
    get:
      summary: Active budget threshold alerts (50/80/100/forecast)
  /finops/forecast:
    get:
      summary: FinOps spend forecast with confidence band
  /finops/ingest/run:
    post:
      summary: Run FinOps billing ingest connectors
  /finops/ingest/status:
    get:
      summary: FinOps billing ingest freshness and reconciliation status
  /finops/reconciliation:
    get:
      summary: Invoice reconciliation snapshots per cloud provider (FIN-PROD-04)
      description: Drift percentage vs invoice total; driftAlert when above 1%.
  /finops/audit/export:
    get:
      summary: Export FinOps mutation audit log as CSV (FIN-PROD-09)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: text/csv attachment (finops-audit.csv)
  /finops/imports:
    post:
      summary: Import custom/SaaS cost feed (CSV/JSON)
  /finops/allocation/tag-suggestions:
    get:
      summary: ML-assisted tagging suggestions for untagged spend
  /finops/commitments:
    get:
      summary: RI/SP/CUD coverage and utilization
  /finops/commitments/recommendations:
    get:
      summary: Commitment purchase recommendations
  /finops/unit-economics:
    get:
      summary: Cost per request/transaction/customer metrics
  /finops/carbon/recommendations:
    get:
      summary: Carbon reduction recommendations with cost trade-off
  /finops/reports:
    get:
      summary: Generated FinOps reports
  /finops/reports/schedule:
    post:
      summary: Schedule FinOps report delivery
  /finops/audit:
    get:
      summary: FinOps mutation audit log
  /finops/chargeback/statements:
    get:
      summary: List showback/chargeback statements
    post:
      summary: Generate chargeback statement per cost-center
  /finops/chargeback/statements/{id}/export:
    get:
      summary: Export chargeback statement as CSV
  /finops/scenarios:
    get:
      summary: List what-if scenario runs
    post:
      summary: Run what-if cost/carbon scenario
  /finops/commitments/alerts:
    get:
      summary: Expiring or under-utilized commitment alerts
  /finops/carbon/recommendations/{id}/actions:
    post:
      summary: Simulate or apply carbon reduction action
  /finops/governance/policies:
    get:
      summary: FinOps governance policies
  /finops/carbon:
    get:
      summary: FinOps carbon footprint estimate
  /network/flows:
    get:
      summary: Network flow records (NPM)
  /network/devices:
    get:
      summary: Monitored network devices
  /network/topology:
    get:
      summary: NPM network topology graph
  /network/anomalies:
    get:
      summary: NPM latency/loss/jitter anomalies
  /network/flows/netflow:
    get:
      summary: Extended NetFlow export records
  /network/sdwan/tunnels:
    get:
      summary: SD-WAN tunnel health metrics
  /network/wireless/links:
    get:
      summary: Wireless access point link metrics
  /apm/sampling/policies:
    get:
      summary: List tail-based trace sampling policies
    post:
      summary: Create tail-based trace sampling policy
  /chat/query:
    post:
      summary: AI chat SSE stream
  /search/logs:
    post:
      summary: Structured log search
  /search/semantic:
    post:
      summary: Semantic search
  /search/ai:
    post:
      summary: AI log search
  /search/trace/{traceId}:
    get:
      summary: Trace log correlation
  /incidents:
    get:
      summary: List incidents
  /alerts:
    get:
      summary: List alerts (proxied)
  /alerts/policies:
    get:
      summary: List alert routing policies
    post:
      summary: Create alert routing policy
  /alerts/policies/{id}:
    put:
      summary: Update alert routing policy
    delete:
      summary: Delete alert routing policy
  /alerts/suppressions:
    get:
      summary: List alert suppressions
    post:
      summary: Create alert suppression window
  /alerts/suppressions/{id}:
    delete:
      summary: Delete alert suppression window
  /metrics/catalog:
    get:
      summary: Metric catalog
  /metrics/query:
    get:
      summary: Metric time series
  /metrics/promql:
    get:
      summary: PromQL proxy
  /dashboards:
    get:
      summary: List dashboards
    post:
      summary: Create dashboard
  /dashboards/{id}:
    get:
      summary: Get dashboard
    put:
      summary: Update dashboard
    delete:
      summary: Delete dashboard
  /apm/retention:
    get:
      summary: Trace retention policy
    put:
      summary: Update retention
  /apm/profiles:
    post:
      summary: Ingest profile sample
  /topology:
    get:
      summary: Service topology
  /slos:
    get:
      summary: List SLOs
    post:
      summary: Create SLO
  /slos/{id}/burn-alert:
    put:
      summary: SLO burn alert
  /integrations:
    get:
      summary: List integrations
  /integrations/{id}/connect:
    post:
      summary: Connect integration
  /integrations/{id}/disconnect:
    post:
      summary: Disconnect integration
  /integrations/{id}/oauth/start:
    get:
      summary: OAuth start (Jira/Slack/ServiceNow)
  /integrations/oauth/callback:
    get:
      summary: OAuth callback
  /cloud/assets:
    get:
      summary: Multi-cloud asset inventory
  /cloud/topology:
    get:
      summary: Cloud asset relationship topology
  /cloud/dashboards:
    get:
      summary: Cloud dashboard catalog
  /cloud/metrics:
    get:
      summary: Cloud metric federation
  /notebooks:
    get:
      summary: List notebooks
    post:
      summary: Create notebook
  /notebooks/{id}/execute:
    post:
      summary: Execute notebook
  /workflows:
    get:
      summary: List workflows (includes branching graph nodes/edges)
    post:
      summary: Create workflow (accepts branching graph; steps derived via topological sort)
  /workflows/{id}:
    put:
      summary: Update workflow (accepts branching graph; steps derived via topological sort)
    delete:
      summary: Delete workflow
  /workflows/trigger:
    post:
      summary: Trigger workflows
  /security/vulnerabilities:
    get:
      summary: List runtime vulnerability findings (live log-derived with demo fallback)
  /security/attacks:
    get:
      summary: List runtime attack events (live log-derived with demo fallback)
  /security/attacks/{id}:
    get:
      summary: Get one attack event by id
  /security/findings:
    get:
      summary: List normalized security findings across AppSec and posture feeds
  /security/findings/{id}:
    get:
      summary: Get security finding by id (includes incident linkage when correlated)
  /security/findings/{id}/correlate:
    post:
      summary: Correlate finding to incident (auto-match or create linkage)
  /nfr/sla/run:
    post:
      summary: Run automated SLA certification checks
  /nfr/benchmark/run:
    post:
      summary: Run live NFR performance benchmark
  /admin/regions:
    get:
      summary: Multi-region active-active deployment status
  /security/sca/import:
    post:
      summary: Import SCA findings payload
  /security/images/import:
    post:
      summary: Import container image security findings payload
  /security/cspm/posture:
    get:
      summary: List CSPM posture checks
  /security/siem/exports:
    post:
      summary: Export security findings/signals to SIEM sink
  /marketplace:
    get:
      summary: List installable apps & extensions catalog with per-tenant install state
  /marketplace/{key}/install:
    post:
      summary: Install (or reconfigure) a marketplace extension
  /marketplace/{key}/uninstall:
    post:
      summary: Uninstall a marketplace extension
  /admin/users:
    get:
      summary: Admin users
    post:
      summary: Invite tenant user (ADMIN)
  /admin/users/{id}:
    patch:
      summary: Update user role or active status (ADMIN)
  /admin/api-keys:
    get:
      summary: API keys
    post:
      summary: Create API key
  /admin/usage:
    get:
      summary: Tenant usage snapshot (logs/traces/metrics live counters with fallback)
  /admin/sso:
    get:
      summary: SSO config (per tenant)
    put:
      summary: Update SSO (multi-tenant reload)
  /admin/abac-policies:
    get:
      summary: Get ABAC policies
    put:
      summary: Update ABAC policies
  /admin/data-residency:
    get:
      summary: Get data residency policy
    put:
      summary: Update data residency policy
  /admin/branding:
    get:
      summary: Get white-label branding theme
    put:
      summary: Update white-label branding theme
  /admin/msp/tenants:
    get:
      summary: List MSP child tenants
    post:
      summary: Register MSP child tenant (ADM-03)
  /exports/warehouse:
    post:
      summary: Export telemetry batch to warehouse
  /exports/bi:
    post:
      summary: Export dataset to BI connector
  /exports/events:
    post:
      summary: Export event stream checkpoint
  /nfr/benchmarks:
    get:
      summary: NFR performance benchmark results
  /nfr/reliability:
    get:
      summary: HA/DR reliability drill results
  /nfr/accessibility:
    get:
      summary: WCAG accessibility certification summary
  /nfr/i18n/locales:
    get:
      summary: Supported UI locales and coverage
  /nfr/certification:
    get:
      summary: Signed NFR certification exit-gate report
  /admin/oncall:
    get:
      summary: On-call schedules
    post:
      summary: Create schedule
  /admin/oncall/{id}:
    put:
      summary: Update schedule
    delete:
      summary: Delete schedule
  /admin/oncall/{id}/sync-pagerduty:
    post:
      summary: PagerDuty sync
  /mobile/push/register:
    post:
      summary: Register Expo push token
  /rum/funnels:
    get:
      summary: List RUM conversion funnels
    post:
      summary: Create RUM conversion funnel
  /rum/beacon:
    post:
      summary: RUM beacon
  /rum/consent:
    post:
      summary: GDPR consent
  /synthetic/browser-tests:
    get:
      summary: List browser synthetic tests
    post:
      summary: Create browser synthetic test
  /synthetic/mobile-tests:
    get:
      summary: List mobile synthetic tests
    post:
      summary: Create mobile synthetic test
  /synthetic/private-locations:
    get:
      summary: List private synthetic probe locations
    post:
      summary: Register private synthetic probe location
  /business/kpi-packs:
    get:
      summary: List business KPI packs
  /business/kpi-packs/{id}/enable:
    post:
      summary: Enable business KPI pack
