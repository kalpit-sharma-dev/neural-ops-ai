worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream ingestion_backend {
        server ingestion:8081;
    }

    server {
        listen 8443 ssl;
        server_name ingestion-mtls;

        ssl_certificate     /etc/nginx/certs/internal-server.crt;
        ssl_certificate_key /etc/nginx/certs/internal-server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_pass http://ingestion_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
