{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuralops-default-deny
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    {{- include "neuralops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuralops-gateway
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    {{- include "neuralops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ingestion
        - podSelector:
            matchLabels:
              app: search
        - podSelector:
            matchLabels:
              app: incident
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8084
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 443
{{- end }}
