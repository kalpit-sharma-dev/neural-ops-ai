{{- if and .Values.finopsCur.enabled .Values.finopsCur.s3.bucket }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-cur-sync
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    {{- include "neuralops.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.finopsCur.syncSchedule | default "0 3 * * *" | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: neuralops
          restartPolicy: OnFailure
          containers:
            - name: cur-sync
              image: amazon/aws-cli:2.15.0
              env:
                - name: AWS_REGION
                  value: {{ .Values.finopsCur.s3.region | default "us-east-1" | quote }}
                {{- if .Values.finopsCur.s3.roleArn }}
                - name: AWS_ROLE_ARN
                  value: {{ .Values.finopsCur.s3.roleArn | quote }}
                {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  DEST="{{ .Values.finopsCur.mountPath }}"
                  mkdir -p "$DEST"
                  aws s3 sync "s3://{{ .Values.finopsCur.s3.bucket }}/{{ .Values.finopsCur.s3.prefix }}" "$DEST" --only-show-errors
                  echo "CUR sync completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              volumeMounts:
                - name: cur-data
                  mountPath: {{ .Values.finopsCur.mountPath }}
          volumes:
            - name: cur-data
              persistentVolumeClaim:
                claimName: finops-cur-data
{{- end }}
