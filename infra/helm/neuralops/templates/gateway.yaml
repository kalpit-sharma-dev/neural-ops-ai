apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuralops
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    {{- include "neuralops.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    app: gateway
    {{- include "neuralops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: neuralops
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/gateway:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          envFrom:
            - configMapRef:
                name: neuralops-config
            {{- if .Values.secrets.create }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            {{- end }}
          env:
            - name: SERVICE_NAME
              value: gateway
            - name: HTTP_PORT
              value: {{ .Values.gateway.port | quote }}
            {{- if .Values.license.enabled }}
            - name: NEURALOPS_LICENSE_PATH
              value: /etc/neuralops/license/{{ .Values.license.key }}
            {{- if .Values.license.secretEnv }}
            - name: NEURALOPS_LICENSE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | default "neuralops-secrets" }}
                  key: {{ .Values.license.secretEnv }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          {{- if or .Values.finopsCur.enabled .Values.license.enabled }}
          volumeMounts:
            {{- if .Values.finopsCur.enabled }}
            - name: finops-cur-data
              mountPath: {{ .Values.finopsCur.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.license.enabled }}
            - name: neuralops-license
              mountPath: /etc/neuralops/license
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.finopsCur.enabled .Values.license.enabled }}
      volumes:
        {{- if .Values.finopsCur.enabled }}
        - name: finops-cur-data
          persistentVolumeClaim:
            claimName: finops-cur-data
        {{- end }}
        {{- if .Values.license.enabled }}
        - name: neuralops-license
          secret:
            secretName: {{ .Values.license.secretName }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilization }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
{{- end }}
