apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuralops
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    {{- include "neuralops.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    app: gateway
    {{- include "neuralops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: neuralops
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/gateway:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          envFrom:
            - configMapRef:
                name: neuralops-config
            {{- if .Values.secrets.create }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            {{- end }}
          env:
            - name: SERVICE_NAME
              value: gateway
            - name: HTTP_PORT
              value: {{ .Values.gateway.port | quote }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilization }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: {{ include "neuralops.namespace" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
{{- end }}
