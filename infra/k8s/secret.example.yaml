# Copy to secret.yaml and replace placeholders before applying.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: neuralops-secrets
  namespace: neuralops
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  JWT_PRIVATE_KEY_PEM: |
    -----BEGIN RSA PRIVATE KEY-----
    replace-me
    -----END RSA PRIVATE KEY-----
  OIDC_CLIENT_SECRET: replace-me
