# Backend microservices share the platform ConfigMap/Secret and expose ClusterIP services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuralops
  namespace: neuralops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: neuralops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      serviceAccountName: neuralops
      containers:
        - name: ingestion
          image: neuralops/ingestion:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: neuralops-config
          env:
            - name: SERVICE_NAME
              value: ingestion
            - name: HTTP_PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /live
              port: 8081
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: neuralops
spec:
  selector:
    app: ingestion
  ports:
    - port: 8081
      targetPort: 8081
