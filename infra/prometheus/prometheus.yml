global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: neuralops-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - ingestion:8081
          - analysis:8082
          - correlation:8083
          - incident:8084
          - search:8085
          - alerting:8086
        labels:
          stack: neuralops

  # kube-state-metrics mock in compose (see infra/k8s-metrics-mock). Use profile kubernetes for real KSM.
  - job_name: kube-state-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080
        labels:
          stack: kubernetes
