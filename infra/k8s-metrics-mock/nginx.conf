server {
    listen 8080;
    server_name _;

    location /metrics {
        default_type text/plain;
        charset utf-8;
        alias /etc/metrics/metrics.prom;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 200 'kube-state-metrics dev mock — use /metrics\n';
        add_header Content-Type text/plain;
    }
}
