name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Unit tests and coverage gate
        run: |
          cd backend && go test ./...
          bash ../scripts/coverage-gate.sh
      - name: Bank tenant isolation & ABAC scope tests
        run: |
          cd backend
          go test ./internal/finops/... -run TestTenantIsolation -count=1
          go test ./internal/observability/... -run TestABAC -count=1
          go test ./internal/gateway/middleware/... -run TestDeveloperScope -count=1
      - name: Contract tests
        run: make contract-test
      - name: OpenAPI contract diff
        run: make openapi-test

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Integration tests (testcontainers)
        run: cd backend && go test -tags=integration ./tests/integration/... -count=1 -timeout=25m

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
      - name: Playwright smoke (UI roadmap)
        run: cd frontend && npm run test:e2e -- e2e/smoke.spec.ts e2e/ui-roadmap.spec.ts e2e/srs-routes.spec.ts e2e/alert-policy-trigger.spec.ts e2e/materialization.spec.ts
        continue-on-error: true
      - name: axe accessibility (critical/serious)
        run: cd frontend && npm run test:e2e -- e2e/a11y.spec.ts
        continue-on-error: true

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate mTLS dev certs
        run: bash scripts/gen-mtls-certs.sh
      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for gateway and Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && break
            sleep 5
          done
          curl -fsS http://localhost:8080/health
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8088/realms/neuralops/.well-known/openid-configuration && break
            sleep 5
          done
      - name: Verify Keycloak OIDC discovery and token grant
        run: bash scripts/verify-keycloak-oidc.sh
      - name: Verify SAML SP metadata (crewjam)
        run: bash scripts/verify-saml-metadata.sh
      - name: Verify mTLS proxy client certificate enforcement
        run: bash scripts/verify-mtls.sh
      - name: Dev auth smoke
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/dev/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@neuralops.ai","tenantId":"00000000-0000-0000-0000-000000000002"}' \
            | grep -q accessToken
      - name: Playwright E2E (auth + chat against live stack)
        run: |
          cd frontend && npm ci
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://localhost:3000 PLAYWRIGHT_API_URL=http://localhost:8080/api/v1 npm run test:e2e
      - name: Verify streaming materialization pipeline
        run: bash scripts/verify-materialization.sh
      - name: k6 load test (observability API)
        run: |
          docker run --rm --network neuralops_neuralops-net \
            -e API_BASE=http://gateway:8080/api/v1 \
            grafana/k6 run - < tests/load/k6/observability.js
      - name: k6 bank POC profile (search + finops)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/scripts/k6:/scripts" \
            -e BASE_URL=http://localhost:8080 \
            -e K6_TENANT=00000000-0000-0000-0000-000000000002 \
            grafana/k6 run /scripts/bank-poc-load.js
      - name: k6 bank ingest profile
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/scripts/k6:/scripts" \
            -e BASE_URL=http://localhost:8080 \
            -e K6_TENANT=00000000-0000-0000-0000-000000000002 \
            grafana/k6 run --vus 5 --duration 30s /scripts/bank-ingest-load.js
      - name: NFR certification (live, gated, signed report)
        run: |
          NEURALOPS_API_URL=http://localhost:8080/api/v1 \
          NFR_OUT_DIR=nfr-report \
          bash scripts/nfr-certify.sh
      - name: Upload signed NFR certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-certification-report
          path: nfr-report/
          if-no-files-found: warn
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  nfr-certification:
    runs-on: ubuntu-latest
    needs: compose-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Download signed NFR report
        uses: actions/download-artifact@v4
        with:
          name: nfr-certification-report
          path: nfr-report
      - name: Verify report signature (tamper-evident)
        run: |
          cd nfr-report
          expected="$(cat nfr-certification.sha256)"
          actual="$(sha256sum nfr-certification.json | awk '{print $1}')"
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"
      - name: Assert NFR gates passed
        run: |
          cd nfr-report
          passed="$(jq -r '.passed' nfr-certification.json)"
          echo "NFR passed=$passed"
          jq '{generatedAt, results, gates, passed}' nfr-certification.json
          test "$passed" = "true"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (backend + infra)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Trivy config scan (Helm/K8s manifests)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra/helm,infra/k8s
          severity: HIGH,CRITICAL
          exit-code: "0"

  ebpf-fleet-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            backend/pkg/nexagent/ebpf/go.sum
      - name: eBPF fleet matrix + host probe
        run: bash scripts/verify-ebpf-fleet.sh
