apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralops-materializer
  namespace: neuralops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuralops-materializer
  template:
    metadata:
      labels:
        app: neuralops-materializer
    spec:
      containers:
        - name: materializer
          image: neuralops/materializer:latest
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_GROUP
              value: neuralops-materializer
            - name: MATERIALIZER_CONCURRENCY
              value: "32"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: neuralops-postgres
                  key: dsn
