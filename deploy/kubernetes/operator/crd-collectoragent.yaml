apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: collectoragents.observability.neuralops.io
spec:
  group: observability.neuralops.io
  scope: Namespaced
  names:
    plural: collectoragents
    singular: collectoragent
    kind: CollectorAgent
    shortNames:
      - colagent
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                environment:
                  type: string
                version:
                  type: string
                policyId:
                  type: string
                canaryVersion:
                  type: string
              required:
                - name
                - version
            status:
              type: object
              properties:
                phase:
                  type: string
                lastReconcileTime:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
